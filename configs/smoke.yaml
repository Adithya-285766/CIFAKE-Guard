# Tiny end-to-end run (a few minutes on CPU) used to check that the whole pipeline works.
# Numbers produced by this config are NOT meaningful results.
seed: 42
paths:
  output_dir: runs/smoke
data:
  train_per_class: 300
  val_per_class: 100
  calib_per_class: 100
  test_per_class: 200
  batch_size: 64
evaluation:
  bootstrap: 100
  robustness_per_class: 50
models:
  LightCNN: {epochs: 1}
  EfficientNetB0: {epochs: 1, img_size: 64, batch_size: 32}
  TinyViT: {epochs: 1}
  SFHybrid: {epochs: 1}
