# Full-data protocol for a GPU (e.g. Google Colab T4). Uses every training image except the
# 2x2500 validation and 2x2500 calibration images, and the full official test split.
# NOTE: this configuration was not executed by the authors of v2 (no GPU available); expect roughly
# 1-3 h on a T4 for all models.
seed: 42
paths:
  output_dir: runs/full_gpu
data:
  train_per_class: null
  val_per_class: 2500
  calib_per_class: 2500
  test_per_class: null
  batch_size: 256
  eval_batch_size: 1024
evaluation:
  bootstrap: 1000
  robustness_per_class: 2000
  ensemble_members: [LightCNN, EfficientNetB0, TinyViT, SFHybrid]
models:
  LightCNN: {epochs: 20}
  EfficientNetB0: {epochs: 10, img_size: 128, batch_size: 256}
  TinyViT: {epochs: 30, warmup_epochs: 3}
  SFHybrid: {epochs: 20}
  SFHybrid_robust:
    arch: sf_hybrid
    epochs: 20
    lr: 2.0e-3
    weight_decay: 5.0e-3
    warmup_epochs: 1
    augment: {robust: true, robust_p: 0.5}
